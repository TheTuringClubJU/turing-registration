name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"

jobs:
  backend-test:
    name: Backend Tests (Pytest & Coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: turing_registration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply database schema
        run: |
          psql "$DATABASE_URL" -f schema.sql
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/turing_registration_test

      - name: Run backend tests
        run: |
          python -m pytest --cov=app --cov-report=term-missing
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://test:test@localhost:5432/turing_registration_test
          BREVO_API_KEY: test-brevo-api-key
          JWT_SECRET: test-jwt-secret-ci

  frontend-test:
    name: Frontend Tests & Build (Vitest & Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit & component tests
        run: npm test

      - name: Verify production build
        run: npm run build
